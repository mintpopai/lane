name: ✨ 功能建议 / Feature request
description: 希望 Lane 增加或改进某个功能 / Suggest a new feature or an improvement
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 issue，相同的建议点个 👍 就能帮我们排优先级。
        Please search existing issues first; a 👍 on an existing request helps us prioritize.

  - type: dropdown
    id: component
    attributes:
      label: 涉及的部分 / Component
      options:
        - 桌面客户端 / Desktop app
        - 用户控制台 / Console
        - 官网 / Website
        - 订阅与套餐 / Plans and subscription
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / Use case
      description: 你在做什么、遇到了什么不便？ / What are you trying to do, and what gets in the way?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 / Proposed solution
      description: 你希望它怎样工作？ / How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代做法 / Current workaround
      description: 现在你是怎么绕过的？（可选） / How do you work around it today? (optional)
